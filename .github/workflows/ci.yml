name: build-and-protocol
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2.2
        ports: ["16379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: test-fixture-only
          MYSQL_ROOT_HOST: "%"
        ports: ["13306:3306"]
        options: --health-cmd "mysqladmin ping -h localhost -ptest-fixture-only" --health-interval 5s --health-timeout 3s --health-retries 30
      mongo:
        image: mongo:8.0.24
        ports: ["17017:27017"]
        options: --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Reactor and service integration
        run: ./mvnw -B -ntp clean verify -Pintegration -Dlfp.mysql.password=test-fixture-only
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: examples/enigma-browser/package-lock.json
      - name: Browser interoperability
        working-directory: examples/enigma-browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run check
          npm test
