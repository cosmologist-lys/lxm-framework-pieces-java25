<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Enigma 协议验证</title>
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <main>
      <h1>Enigma 协议验证</h1>
      <p>建立会话后，验证参数签名、JSON 加解密、密钥刷新和错误处理。</p>
      <label for="token">测试凭证</label
      ><input id="token" type="password" value="browser-test" autocomplete="off" />
      <div class="actions">
        <button id="session">建立会话</button><button id="run">运行全部验证</button
        ><button id="refresh">刷新密钥</button><button id="revoke">撤销会话</button>
      </div>
      <pre id="status" role="status" aria-live="polite">等待测试</pre>
    </main>
    <script type="module" src="demo.js"></script>
  </body>
</html>
